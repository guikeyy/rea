name: Sync upstream repo

on:
  schedule:
    - cron: '0 0 * * *'   # 每天 UTC 00:00
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add upstream remote and fetch
        run: |
          git remote add upstream https://github.com/morluto/rea.git || true
          git fetch --no-tags upstream

      - name: Merge upstream changes into fork
        run: |
          set -e
          CURRENT_BRANCH=$(git rev-parse --abbrev-ref HEAD)
          echo "Current branch: $CURRENT_BRANCH"

          if git show-ref --verify --quiet refs/heads/$CURRENT_BRANCH; then
            git checkout $CURRENT_BRANCH
          else
            git checkout -b $CURRENT_BRANCH
          fi

          if git merge --ff-only upstream/main; then
            echo "Merged upstream/main"
          elif git merge --ff-only upstream/master; then
            echo "Merged upstream/master"
          elif git merge --no-edit upstream/main; then
            echo "Merged upstream/main (non-ff)"
          elif git merge --no-edit upstream/master; then
            echo "Merged upstream/master (non-ff)"
          else
            echo "No matching upstream branch or no updates available."
          fi

      - name: Push updates to fork
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin HEAD || echo "Nothing to push."
