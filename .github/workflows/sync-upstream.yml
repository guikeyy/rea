name: Sync upstream repo

on:
  schedule:
    - cron: '0 0 * * *'   # 示例：每小时一次，按需改为 '0 0 * * *'（每天）
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork (shallow)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Add upstream and fetch default branch shallow
        run: |
          git remote add upstream https://github.com/morluto/rea.git || true
          if git ls-remote --heads upstream main; then
            git fetch --no-tags --depth=1 upstream main
            UPSTREAM_REF=upstream/main
          elif git ls-remote --heads upstream master; then
            git fetch --no-tags --depth=1 upstream master
            UPSTREAM_REF=upstream/master
          else
            echo "No main/master on upstream"
            exit 0
          fi

      - name: Merge (ff-only preferred)
        run: |
          TARGET_BRANCH=$(git rev-parse --abbrev-ref HEAD || echo main)
          git checkout -B "$TARGET_BRANCH"
          if git merge --ff-only "$UPSTREAM_REF"; then
            echo "Fast-forwarded"
          else
            git merge --no-edit "$UPSTREAM_REF" || { echo 'Merge failed (conflict)'; exit 1; }
          fi

      - name: Push to fork
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin HEAD:"$TARGET_BRANCH" || echo "Nothing to push or push failed"
